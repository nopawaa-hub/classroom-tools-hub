<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Around the World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
        }

        /* Subtle map background pattern */
        .bg-map {
            background-color: #e0f2fe;
            background-image: radial-gradient(#7dd3fc 2px, transparent 2px);
            background-size: 40px 40px;
        }

        .btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            top: 0;
        }
        
        .btn:active:not(:disabled) {
            top: 4px;
            box-shadow: 0 0px 0px 0px rgba(0,0,0,0.2) !important;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .roulette-highlight {
            animation: popOut 0.2s ease-out;
            transform: scale(1.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        @keyframes popOut {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        /* Ensures stars wrap nicely */
        .star-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
            min-height: 24px;
        }
    </style>
</head>
<body class="bg-map h-screen w-screen flex flex-col">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        
        const Sun = () => (
            <svg viewBox="0 0 100 100" className="w-48 h-48 drop-shadow-xl inline-block">
                <circle cx="50" cy="50" r="25" fill="#FFD700" />
                <path d="M50 10 L50 20 M50 80 L50 90 M10 50 L20 50 M80 50 L90 50 M22 22 L29 29 M71 71 L78 78 M22 78 L29 71 M71 29 L78 22" stroke="#FFD700" strokeWidth="6" strokeLinecap="round" />
                <circle cx="43" cy="45" r="3" fill="#333" />
                <circle cx="57" cy="45" r="3" fill="#333" />
                <path d="M45 55 Q50 62 55 55" stroke="#333" strokeWidth="3" fill="none" strokeLinecap="round" />
            </svg>
        );

        const Rainy = () => (
            <svg viewBox="0 0 100 100" className="w-48 h-48 drop-shadow-xl inline-block">
                <path d="M25 60 Q25 40 45 40 Q55 25 70 35 Q85 35 85 55 Q85 70 65 70 L35 70 Q25 70 25 60 Z" fill="#9CA3AF" />
                <path d="M35 75 L30 85 M50 75 L45 85 M65 75 L60 85 M42 80 L37 90 M57 80 L52 90" stroke="#3B82F6" strokeWidth="4" strokeLinecap="round" />
                <circle cx="45" cy="50" r="3" fill="#1F2937" />
                <circle cx="65" cy="50" r="3" fill="#1F2937" />
                <path d="M50 58 Q55 63 60 58" stroke="#1F2937" strokeWidth="3" fill="none" strokeLinecap="round" />
            </svg>
        );

        const Cloudy = () => (
            <svg viewBox="0 0 100 100" className="w-48 h-48 drop-shadow-xl inline-block">
                <path d="M25 60 Q25 40 45 40 Q55 25 70 35 Q85 35 85 55 Q85 70 65 70 L35 70 Q25 70 25 60 Z" fill="#FFFFFF" />
                <circle cx="45" cy="50" r="3" fill="#333" />
                <circle cx="65" cy="50" r="3" fill="#333" />
                <path d="M50 58 Q55 63 60 58" stroke="#333" strokeWidth="3" fill="none" strokeLinecap="round" />
            </svg>
        );

        const Windy = () => (
            <svg viewBox="0 0 100 100" className="w-48 h-48 drop-shadow-xl inline-block">
                <path d="M20 40 Q40 40 45 30 Q50 20 40 20 Q30 20 20 30" fill="none" stroke="#60A5FA" strokeWidth="4" strokeLinecap="round" />
                <path d="M10 60 Q50 60 60 45 Q70 30 55 25" fill="none" stroke="#60A5FA" strokeWidth="4" strokeLinecap="round" />
                <path d="M15 80 Q60 80 75 70 Q90 60 75 50 Q60 40 50 55" fill="none" stroke="#60A5FA" strokeWidth="4" strokeLinecap="round" />
                <path d="M80 30 C 90 20, 95 30, 85 40 Z" fill="#34D399" />
                <path d="M70 75 C 80 85, 85 75, 75 65 Z" fill="#34D399" />
            </svg>
        );

        const Snowy = () => (
            <svg viewBox="0 0 100 100" className="w-48 h-48 drop-shadow-xl inline-block">
                <path d="M25 50 Q25 30 45 30 Q55 15 70 25 Q85 25 85 45 Q85 60 65 60 L35 60 Q25 60 25 50 Z" fill="#E5E7EB" />
                <path d="M35 70 L35 80 M30 75 L40 75 M32 72 L38 78 M38 72 L32 78" stroke="#60A5FA" strokeWidth="2" strokeLinecap="round" />
                <path d="M55 80 L55 90 M50 85 L60 85 M52 82 L58 88 M58 82 L52 88" stroke="#60A5FA" strokeWidth="2" strokeLinecap="round" />
                <path d="M75 65 L75 75 M70 70 L80 70 M72 67 L78 73 M78 67 L72 73" stroke="#60A5FA" strokeWidth="2" strokeLinecap="round" />
                <circle cx="45" cy="40" r="3" fill="#333" />
                <circle cx="65" cy="40" r="3" fill="#333" />
                <circle cx="55" cy="48" r="2" fill="#333" />
            </svg>
        );

        const Stormy = () => (
            <svg viewBox="0 0 100 100" className="w-48 h-48 drop-shadow-xl inline-block">
                <path d="M25 55 Q25 35 45 35 Q55 20 70 30 Q85 30 85 50 Q85 65 65 65 L35 65 Q25 65 25 55 Z" fill="#4B5563" />
                <path d="M50 65 L40 80 L55 80 L45 95" fill="none" stroke="#FBBF24" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" />
                <path d="M70 65 L65 75 L75 75 L70 85" fill="none" stroke="#FBBF24" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                <circle cx="45" cy="45" r="3" fill="#FFFFFF" />
                <circle cx="65" cy="45" r="3" fill="#FFFFFF" />
                <path d="M42 40 L48 42 M68 40 L62 42" stroke="#FFFFFF" strokeWidth="2" strokeLinecap="round" />
            </svg>
        );

        const Foggy = () => (
            <svg viewBox="0 0 100 100" className="w-48 h-48 drop-shadow-xl inline-block">
                <path d="M25 45 Q25 25 45 25 Q55 10 70 20 Q85 20 85 40 Q85 55 65 55 L35 55 Q25 55 25 45 Z" fill="#D1D5DB" />
                <path d="M20 65 L80 65 M30 75 L70 75 M40 85 L60 85 M10 55 L30 55" stroke="#9CA3AF" strokeWidth="4" strokeLinecap="round" />
                <circle cx="45" cy="35" r="3" fill="#333" />
                <circle cx="65" cy="35" r="3" fill="#333" />
                <circle cx="55" cy="42" r="2" fill="#333" />
            </svg>
        );

        const Hot = () => (
            <svg viewBox="0 0 100 100" className="w-48 h-48 drop-shadow-xl inline-block">
                <circle cx="40" cy="50" r="25" fill="#EF4444" />
                <path d="M40 10 L40 20 M40 80 L40 90 M10 50 L20 50 M60 50 L70 50 M19 19 L26 26 M54 81 L61 88 M19 81 L26 74 M54 19 L61 26" stroke="#EF4444" strokeWidth="5" strokeLinecap="round" />
                <rect x="75" y="20" width="10" height="50" rx="5" fill="#FFFFFF" stroke="#333" strokeWidth="2" />
                <circle cx="80" cy="75" r="8" fill="#EF4444" />
                <rect x="78" y="45" width="4" height="30" fill="#EF4444" />
                <circle cx="33" cy="45" r="3" fill="#333" />
                <circle cx="47" cy="45" r="3" fill="#333" />
                <path d="M37 55 Q40 60 43 55" stroke="#333" strokeWidth="2" fill="none" strokeLinecap="round" />
                <path d="M47 35 Q50 32 53 35" stroke="#333" strokeWidth="2" fill="none" strokeLinecap="round" />
            </svg>
        );

        const WeatherIcon = ({ type }) => {
            switch(type.toLowerCase()) {
                case 'sunny': return <Sun />;
                case 'rainy': return <Rainy />;
                case 'cloudy': return <Cloudy />;
                case 'windy': return <Windy />;
                case 'snowy': return <Snowy />;
                case 'stormy': return <Stormy />;
                case 'foggy': return <Foggy />;
                case 'hot': return <Hot />;
                default: return <Sun />;
            }
        };

        
        const TEAMS = [
            { id: 'red', name: '🔴 RED GROUP', color: 'bg-red-500', border: 'border-red-600', text: 'text-red-900' },
            { id: 'blue', name: '🔵 BLUE GROUP', color: 'bg-blue-500', border: 'border-blue-600', text: 'text-blue-900' },
            { id: 'pink', name: '🩷 PINK GROUP', color: 'bg-pink-400', border: 'border-pink-500', text: 'text-pink-900' },
            { id: 'yellow', name: '🟡 YELLOW GROUP', color: 'bg-yellow-400', border: 'border-yellow-500', text: 'text-yellow-900' },
            { id: 'green', name: '🟢 GREEN GROUP', color: 'bg-green-500', border: 'border-green-600', text: 'text-green-900' }
        ];

        const CORE_QUESTIONS = [
            { country: 'Malaysia', flag: '🇲🇾', weather: 'Rainy' },
            { country: 'Canada', flag: '🇨🇦', weather: 'Snowy' },
            { country: 'Australia', flag: '🇦🇺', weather: 'Sunny' },
            { country: 'Russia', flag: '🇷🇺', weather: 'Windy' },
            { country: 'United Kingdom', flag: '🇬🇧', weather: 'Cloudy' }
        ];

        const EXTRA_WEATHERS = ['Sunny', 'Rainy', 'Cloudy', 'Windy', 'Snowy', 'Stormy', 'Foggy', 'Hot'];
        const EXTRA_COUNTRIES = [
            { country: 'Malaysia', flag: '🇲🇾' },
            { country: 'Canada', flag: '🇨🇦' },
            { country: 'Australia', flag: '🇦🇺' },
            { country: 'Russia', flag: '🇷🇺' },
            { country: 'United Kingdom', flag: '🇬🇧' }
        ];

        let audioCtx;
        
        const initAudio = () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        const playSoundEffect = (type) => {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.7);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.7);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        };

        const speakText = (text, onEnd = null) => {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Kid-friendly adjustments
                utterance.rate = 0.85; 
                utterance.pitch = 1.1; 
                
                const voices = window.speechSynthesis.getVoices();
                const engVoices = voices.filter(v => v.lang.startsWith('en'));
                
                if (engVoices.length > 0) {
                    // Try to find a friendly UK or female voice
                    const preferredVoice = engVoices.find(v => 
                        v.name.includes('Female') || 
                        v.name.includes('UK') || 
                        v.name.includes('Google UK English Female')
                    );
                    utterance.voice = preferredVoice || engVoices[0];
                }
                
                if (onEnd) utterance.onend = onEnd;
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("Text-to-speech not supported in this browser.");
                if(onEnd) onEnd();
            }
        };


        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [gameState, setGameState] = useState('START'); // START, ROULETTE, LISTEN, MAP_COUNTDOWN, REVEAL, END
            const [scores, setScores] = useState({ red: 0, blue: 0, pink: 0, yellow: 0, green: 0 });
            const [isExtraPractice, setIsExtraPractice] = useState(false);
            
            const [activeGroupIndex, setActiveGroupIndex] = useState(null);
            const [highlightedIndex, setHighlightedIndex] = useState(null);
            
            const [corePool, setCorePool] = useState([...CORE_QUESTIONS].sort(() => Math.random() - 0.5));
            const [currentQuestion, setCurrentQuestion] = useState(null);
            
            const [countdown, setCountdown] = useState(10);
            const [isPaused, setIsPaused] = useState(false);
            const timerRef = useRef(null);

            // Ensure speech voices are loaded
            useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                }
            }, []);

            const resetGame = () => {
                setScores({ red: 0, blue: 0, pink: 0, yellow: 0, green: 0 });
                setCorePool([...CORE_QUESTIONS].sort(() => Math.random() - 0.5));
                setGameState('START');
            };

            const generateQuestion = () => {
                if (!isExtraPractice) {
                    if (corePool.length === 0) {
                        // Refill and shuffle pool if empty
                        const newPool = [...CORE_QUESTIONS].sort(() => Math.random() - 0.5);
                        const q = newPool.pop();
                        setCorePool(newPool);
                        return q;
                    } else {
                        const newPool = [...corePool];
                        const q = newPool.pop();
                        setCorePool(newPool);
                        return q;
                    }
                } else {
                    const countryObj = EXTRA_COUNTRIES[Math.floor(Math.random() * EXTRA_COUNTRIES.length)];
                    const weather = EXTRA_WEATHERS[Math.floor(Math.random() * EXTRA_WEATHERS.length)];
                    return { country: countryObj.country, flag: countryObj.flag, weather: weather };
                }
            };

            const startRoundRoulette = () => {
                initAudio();
                setGameState('ROULETTE');
                let count = 0;
                const maxSpins = 20;
                const interval = setInterval(() => {
                    setHighlightedIndex(count % 5);
                    count++;
                    if (count > maxSpins) {
                        clearInterval(interval);
                        // Pick random group, but try not to pick the same one consecutively
                        let finalIndex;
                        do {
                            finalIndex = Math.floor(Math.random() * 5);
                        } while (finalIndex === activeGroupIndex && maxSpins > 0);
                        
                        setActiveGroupIndex(finalIndex);
                        setHighlightedIndex(finalIndex);
                        setTimeout(() => {
                            const q = generateQuestion();
                            setCurrentQuestion(q);
                            setGameState('LISTEN');
                        }, 1500);
                    }
                }, 100);
            };


            const playSentence = () => {
                const sentence = `It is ${currentQuestion.weather.toLowerCase()} in ${currentQuestion.country.includes('United') ? 'the ' : ''}${currentQuestion.country}.`;
                speakText(sentence);
            };

            const handleGoToMap = () => {
                setGameState('MAP_COUNTDOWN');
                setCountdown(10);
                setIsPaused(false);
            };

            useEffect(() => {
                if (gameState === 'MAP_COUNTDOWN' && !isPaused && countdown > 0) {
                    timerRef.current = setTimeout(() => setCountdown(c => c - 1), 1000);
                }
                return () => clearTimeout(timerRef.current);
            }, [gameState, countdown, isPaused]);

            const handleCorrect = () => {
                playSoundEffect('correct');
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#FFD700', '#FF4500', '#00FF00', '#00BFFF', '#FF1493']
                });
                
                const activeTeamId = TEAMS[activeGroupIndex].id;
                setScores(prev => ({ ...prev, [activeTeamId]: prev[activeTeamId] + 1 }));
                setGameState('REVEAL');
            };

            const handleTryAgain = () => {
                playSoundEffect('wrong');
                setGameState('LISTEN'); // Go back to let them hear it again
            };

            const Scoreboard = () => (
                <div className="w-full flex justify-center gap-4 p-4 z-20">
                    {TEAMS.map((team, idx) => (
                        <div key={team.id} className={`flex-1 max-w-[220px] rounded-2xl border-4 ${team.border} ${team.color} p-3 text-center shadow-lg transition-transform ${highlightedIndex === idx ? 'roulette-highlight' : ''}`}>
                            <h3 className={`font-black text-white drop-shadow-md text-xl md:text-2xl mb-2`}>{team.name}</h3>
                            <div className="bg-white/90 rounded-xl py-2 px-4 border-2 border-black/10">
                                <span className={`text-4xl font-black ${team.text}`}>{scores[team.id]}</span>
                                <div className="star-container mt-1">
                                    {scores[team.id] === 0 ? <span className="opacity-0">⭐</span> : 
                                     Array.from({ length: scores[team.id] }).map((_, i) => <span key={i} className="text-xl inline-block drop-shadow-sm">⭐</span>)}
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );


            return (
                <div className="flex flex-col h-full relative">
                    <Scoreboard />
                    
                    <div className="flex-1 flex flex-col items-center justify-center p-6 relative">
                        
                        {/* START SCREEN */}
                        {gameState === 'START' && (
                            <div className="bg-white/95 border-8 border-blue-400 p-12 rounded-3xl shadow-2xl text-center max-w-4xl bounce-in">
                                <h1 className="text-6xl font-black text-blue-600 mb-4 drop-shadow-sm uppercase tracking-wide">Weather Around the World<br/><span className="text-yellow-500 text-7xl">Challenge</span></h1>
                                <p className="text-3xl text-gray-700 font-bold mb-10">"Listen carefully. Find the country. Find the weather."</p>
                                
                                <div className="flex flex-col items-center gap-8 mt-12">
                                    <button 
                                        onClick={startRoundRoulette}
                                        className="btn bg-green-500 hover:bg-green-400 text-white border-b-8 border-green-700 rounded-2xl px-16 py-6 text-5xl font-black shadow-[0_10px_20px_rgba(0,0,0,0.2)]"
                                    >
                                        START GAME 🚀
                                    </button>
                                    
                                    <div className="bg-gray-100 p-4 rounded-xl border-4 border-gray-300 flex items-center gap-6 shadow-inner">
                                        <span className="text-2xl font-bold text-gray-700">Teacher Options:</span>
                                        <button 
                                            onClick={() => setIsExtraPractice(false)}
                                            className={`px-6 py-3 rounded-xl font-bold text-xl transition-all ${!isExtraPractice ? 'bg-blue-500 text-white shadow-md scale-105' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}
                                        >
                                            CORE QUESTIONS
                                        </button>
                                        <button 
                                            onClick={() => setIsExtraPractice(true)}
                                            className={`px-6 py-3 rounded-xl font-bold text-xl transition-all ${isExtraPractice ? 'bg-purple-500 text-white shadow-md scale-105' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}
                                        >
                                            EXTRA PRACTICE
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ROULETTE SCREEN */}
                        {gameState === 'ROULETTE' && (
                            <div className="text-center bounce-in">
                                <h2 className="text-6xl font-black text-gray-800 drop-shadow-md mb-8">Selecting a group...</h2>
                                <div className="text-8xl animate-spin">🎲</div>
                                {activeGroupIndex !== null && (
                                    <div className="mt-8">
                                        <h2 className="text-6xl font-black bounce-in" style={{color: TEAMS[activeGroupIndex].color.replace('bg-', '').replace('-500', '').replace('-400', '')}}>
                                            {TEAMS[activeGroupIndex].name} - GET READY!
                                        </h2>
                                    </div>
                                )}
                            </div>
                        )}


                        {/* LISTEN SCREEN */}
                        {gameState === 'LISTEN' && (
                            <div className="bg-white/95 border-8 border-indigo-400 p-12 rounded-3xl shadow-2xl text-center max-w-3xl w-full bounce-in flex flex-col items-center">
                                <h2 className="text-6xl font-black text-indigo-600 mb-8 uppercase pulse">LISTEN CAREFULLY 👂</h2>
                                <div className="flex gap-6 my-10">
                                    <button 
                                        onClick={playSentence}
                                        className="btn bg-blue-500 hover:bg-blue-400 text-white border-b-8 border-blue-700 rounded-3xl p-8 shadow-[0_10px_20px_rgba(0,0,0,0.2)] flex flex-col items-center justify-center gap-2"
                                    >
                                        <span className="text-7xl">🔊</span>
                                        <span className="text-3xl font-black mt-2">PLAY AUDIO</span>
                                    </button>
                                    <button 
                                        onClick={playSentence}
                                        className="btn bg-orange-400 hover:bg-orange-300 text-white border-b-8 border-orange-600 rounded-3xl p-8 shadow-[0_10px_20px_rgba(0,0,0,0.2)] flex flex-col items-center justify-center gap-2"
                                    >
                                        <span className="text-7xl">🔁</span>
                                        <span className="text-3xl font-black mt-2">PLAY AGAIN</span>
                                    </button>
                                </div>
                                <div className="w-full h-2 bg-gray-200 rounded-full my-6"></div>
                                <button 
                                    onClick={handleGoToMap}
                                    className="btn bg-green-500 hover:bg-green-400 text-white border-b-6 border-green-700 rounded-2xl px-12 py-5 text-4xl font-black shadow-lg mt-4 w-full"
                                >
                                    READY? GO TO MAP! 🗺️
                                </button>
                            </div>
                        )}

                        {/* MAP COUNTDOWN SCREEN */}
                        {gameState === 'MAP_COUNTDOWN' && (
                            <div className="bg-white/95 border-8 border-yellow-400 p-10 rounded-3xl shadow-2xl text-center max-w-4xl w-full bounce-in">
                                <h2 className="text-7xl font-black text-gray-800 mb-4">GO TO THE MAP!</h2>
                                <p className="text-4xl font-bold text-blue-600 mb-8">Match the country with the weather.</p>
                                
                                <div className="text-[180px] font-black text-red-500 leading-none drop-shadow-xl mb-8">
                                    {countdown > 0 ? countdown : "TIME'S UP!"}
                                </div>
                                
                                <div className="flex justify-center gap-4 mb-10">
                                    <button 
                                        onClick={() => setIsPaused(!isPaused)}
                                        className="btn bg-gray-300 hover:bg-gray-200 text-gray-800 border-b-6 border-gray-500 rounded-xl px-8 py-3 text-2xl font-bold"
                                    >
                                        {isPaused ? '▶️ RESUME' : '⏸️ PAUSE COUNTDOWN'}
                                    </button>
                                    <button 
                                        onClick={() => setCountdown(0)}
                                        className="btn bg-gray-300 hover:bg-gray-200 text-gray-800 border-b-6 border-gray-500 rounded-xl px-8 py-3 text-2xl font-bold"
                                    >
                                        ⏭️ SKIP COUNTDOWN
                                    </button>
                                </div>

                                <div className="w-full bg-gray-200 rounded-3xl p-6 border-4 border-gray-300 flex justify-center gap-8 mt-4">
                                    <button 
                                        onClick={handleCorrect}
                                        className="btn bg-green-500 hover:bg-green-400 text-white border-b-8 border-green-700 rounded-2xl px-12 py-6 text-5xl font-black shadow-lg w-1/2 flex items-center justify-center gap-4"
                                    >
                                        ✅ CORRECT
                                    </button>
                                    <button 
                                        onClick={handleTryAgain}
                                        className="btn bg-red-500 hover:bg-red-400 text-white border-b-8 border-red-700 rounded-2xl px-12 py-6 text-5xl font-black shadow-lg w-1/2 flex items-center justify-center gap-4"
                                    >
                                        ❌ TRY AGAIN
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* REVEAL SCREEN */}
                        {gameState === 'REVEAL' && currentQuestion && (
                            <div className="bg-white/95 border-8 border-green-400 p-10 rounded-3xl shadow-2xl text-center max-w-4xl w-full bounce-in">
                                <h2 className="text-6xl font-black text-gray-800 mb-8 border-b-4 border-gray-200 pb-6">
                                    "It is {currentQuestion.weather.toLowerCase()} in {currentQuestion.country.includes('United') ? 'the ' : ''}{currentQuestion.country}."
                                </h2>
                                
                                <div className="flex justify-center items-center gap-16 mb-12">
                                    <div className="flex flex-col items-center bg-blue-50 p-8 rounded-3xl border-4 border-blue-200 w-[350px]">
                                        <span className="text-2xl font-bold text-gray-500 mb-2 uppercase tracking-widest">Country</span>
                                        <span className="text-8xl mb-4 drop-shadow-md">{currentQuestion.flag}</span>
                                        <span className="text-5xl font-black text-gray-800">{currentQuestion.country.toUpperCase()}</span>
                                    </div>
                                    <div className="text-7xl text-gray-300 font-black">+</div>
                                    <div className="flex flex-col items-center bg-yellow-50 p-8 rounded-3xl border-4 border-yellow-200 w-[350px]">
                                        <span className="text-2xl font-bold text-gray-500 mb-2 uppercase tracking-widest">Weather</span>
                                        <div className="mb-2"><WeatherIcon type={currentQuestion.weather} /></div>
                                        <span className="text-5xl font-black text-gray-800">{currentQuestion.weather.toUpperCase()}</span>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={startRoundRoulette}
                                    className="btn bg-blue-500 hover:bg-blue-400 text-white border-b-8 border-blue-700 rounded-2xl px-16 py-6 text-5xl font-black shadow-[0_10px_20px_rgba(0,0,0,0.2)]"
                                >
                                    NEXT ROUND ➡️
                                </button>
                            </div>
                        )}


                        {/* END SCREEN */}
                        {gameState === 'END' && (
                            <div className="bg-white/95 border-8 border-purple-500 p-12 rounded-3xl shadow-2xl text-center max-w-5xl w-full overflow-y-auto max-h-[80vh] bounce-in relative">
                                <button onClick={resetGame} className="absolute top-6 right-6 btn bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-xl border-b-4 border-gray-400">Restart Game</button>
                                
                                <h1 className="text-7xl font-black text-purple-600 mb-6 drop-shadow-sm uppercase">GREAT JOB! 🎉</h1>
                                
                                <div className="flex justify-center gap-4 mb-10 flex-wrap">
                                    {TEAMS.map((team) => (
                                        <div key={team.id} className={`${team.color} ${team.text} p-4 rounded-2xl border-4 ${team.border} text-2xl font-black min-w-[180px] shadow-md`}>
                                            {team.name.split(' ')[0]} : {scores[team.id]} ⭐
                                        </div>
                                    ))}
                                </div>

                                <h2 className="text-4xl font-bold text-gray-800 mb-8 bg-purple-100 p-4 rounded-xl inline-block border-2 border-purple-200">
                                    Let’s read the weather reports together! 📖
                                </h2>
                                
                                <div className="flex flex-col gap-4">
                                    {CORE_QUESTIONS.map((q, idx) => (
                                        <div 
                                            key={idx} 
                                            onClick={() => speakText(`It is ${q.weather.toLowerCase()} in ${q.country.includes('United') ? 'the ' : ''}${q.country}.`)}
                                            className="btn flex items-center gap-6 bg-gray-50 hover:bg-blue-50 p-4 rounded-2xl border-4 border-gray-200 cursor-pointer text-left transition-colors"
                                        >
                                            <div className="text-4xl">{q.flag}</div>
                                            <div className="w-20 flex justify-center scale-75 transform -my-4 origin-center"><WeatherIcon type={q.weather} /></div>
                                            <div className="text-4xl font-bold text-gray-700 flex-1">
                                                It is <span className="text-blue-600">{q.weather.toLowerCase()}</span> in {q.country.includes('United') ? 'the ' : ''}<span className="text-red-500">{q.country}</span>.
                                            </div>
                                            <div className="text-4xl">🔊</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </div>

                    {/* PERSISTENT BOTTOM TEACHER CONTROLS */}
                    <div className="bg-gray-900 text-white p-4 flex justify-between items-center z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.2)]">
                        <div className="flex gap-4 items-center">
                            <span className="font-bold text-gray-400 uppercase tracking-widest text-sm">Teacher Controls</span>
                            {gameState !== 'START' && gameState !== 'END' && (
                                <button 
                                    onClick={startRoundRoulette}
                                    className="btn bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-6 rounded-xl border-b-4 border-indigo-800"
                                >
                                    Select Another Group
                                </button>
                            )}
                        </div>
                        <div className="flex gap-4">
                            <button 
                                onClick={resetGame}
                                className="btn bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-xl border-b-4 border-gray-800"
                            >
                                Reset Scores
                            </button>
                            <button 
                                onClick={() => setGameState('END')}
                                className="btn bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-6 rounded-xl border-b-4 border-red-800"
                            >
                                End Game
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
